<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 9 7" fill="#f97316" shape-rendering="crispEdges">
  <!-- top bar -->
  <rect x="1" y="0" width="7" height="1"/>
  <!-- left side (full height) -->
  <rect x="0" y="1" width="1" height="5"/>
  <!-- middle arm — right half only, defining the G -->
  <rect x="5" y="3" width="4" height="1"/>
  <!-- right side — lower half only -->
  <rect x="8" y="4" width="1" height="2"/>
  <!-- bottom bar -->
  <rect x="1" y="6" width="7" height="1"/>
</svg>
