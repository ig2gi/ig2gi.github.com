<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Earth Globe -->
  <defs>
    <clipPath id="globe-clip">
      <ellipse cx="200" cy="280" rx="80" ry="78"/>
    </clipPath>
  </defs>
  <!-- Earth Globe - slightly elliptical -->
  <ellipse cx="200" cy="280" rx="80" ry="78" fill="none" stroke="#000" stroke-width="3"/>
  <path d="M 120 280 Q 200 260 280 280" fill="none" stroke="#000" stroke-width="2"/>
  <path d="M 120 280 Q 200 300 280 280" fill="none" stroke="#000" stroke-width="2"/>
  <circle cx="200" cy="280" r="3" fill="#000"/>
  
  <!-- Hachures on equator area - parallel lines -->
  <g clip-path="url(#globe-clip)">
    <!-- Parallel diagonal lines across equator -->
    <line x1="130" y1="275" x2="140" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="140" y1="275" x2="150" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="150" y1="275" x2="160" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="160" y1="275" x2="170" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="170" y1="275" x2="180" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="180" y1="275" x2="190" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="190" y1="275" x2="200" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="200" y1="275" x2="210" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="210" y1="275" x2="220" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="220" y1="275" x2="230" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="230" y1="275" x2="240" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="240" y1="275" x2="250" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="250" y1="275" x2="260" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
    <line x1="260" y1="275" x2="270" y2="285" stroke="#000" stroke-width="1.5" opacity="0.6"/>
  </g>
  
  <!-- Person's body and legs (walking on globe) -->
  <!-- Left leg -->
  <line x1="200" y1="200" x2="190" y2="250" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="190" cy="255" r="6" fill="#000"/>
  
  <!-- Right leg (stepping forward) -->
  <line x1="200" y1="200" x2="210" y2="245" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  <circle cx="210" cy="250" r="6" fill="#000"/>
  
  <!-- Torso -->
  <line x1="200" y1="200" x2="200" y2="160" stroke="#000" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Arms (walking motion) -->
  <line x1="200" y1="180" x2="185" y2="195" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="180" x2="215" y2="195" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Connection line from body to head in stars -->
  <line x1="200" y1="160" x2="200" y2="100" stroke="#000" stroke-width="2" stroke-dasharray="3,3"/>
  
  <!-- Stars (head/mind area) -->
  <g id="stars">
    <!-- Main star (head) -->
    <path d="M 200 60 L 205 75 L 220 75 L 208 85 L 212 100 L 200 92 L 188 100 L 192 85 L 180 75 L 195 75 Z" fill="#000"/>
    
    <!-- Surrounding stars -->
    <path d="M 160 50 L 162 55 L 167 55 L 163 59 L 165 64 L 160 61 L 155 64 L 157 59 L 153 55 L 158 55 Z" fill="#000"/>
    <path d="M 240 50 L 242 55 L 247 55 L 243 59 L 245 64 L 240 61 L 235 64 L 237 59 L 233 55 L 238 55 Z" fill="#000"/>
    <path d="M 180 30 L 182 35 L 187 35 L 183 39 L 185 44 L 180 41 L 175 44 L 177 39 L 173 35 L 178 35 Z" fill="#000"/>
    <path d="M 220 30 L 222 35 L 227 35 L 223 39 L 225 44 L 220 41 L 215 44 L 217 39 L 213 35 L 218 35 Z" fill="#000"/>
    <path d="M 200 20 L 201 23 L 204 23 L 202 25 L 203 28 L 200 26 L 197 28 L 198 25 L 196 23 L 199 23 Z" fill="#000"/>
    <path d="M 140 70 L 141 73 L 144 73 L 142 75 L 143 78 L 140 76 L 137 78 L 138 75 L 136 73 L 139 73 Z" fill="#000"/>
    <path d="M 260 70 L 261 73 L 264 73 L 262 75 L 263 78 L 260 76 L 257 78 L 258 75 L 256 73 L 259 73 Z" fill="#000"/>
  </g>
  
  <!-- Small decorative stars scattered -->
  <circle cx="150" cy="40" r="1.5" fill="#000"/>
  <circle cx="250" cy="40" r="1.5" fill="#000"/>
  <circle cx="130" cy="60" r="1.5" fill="#000"/>
  <circle cx="270" cy="60" r="1.5" fill="#000"/>
  <circle cx="170" cy="20" r="1.5" fill="#000"/>
  <circle cx="230" cy="20" r="1.5" fill="#000"/>
</svg>
